name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "ci/source-bundle/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source-bundle/source-*.b64 | tr -d '\n' | base64 --decode > /tmp/multi-ai-trading-source.tar.gz
          gzip -t /tmp/multi-ai-trading-source.tar.gz
          tar -tzf /tmp/multi-ai-trading-source.tar.gz > /tmp/multi-ai-trading-source-files.txt
          head -40 /tmp/multi-ai-trading-source-files.txt
          tar -xzf /tmp/multi-ai-trading-source.tar.gz -C .
          test -f MultiAITradingAndroid/app/build.gradle.kts
          chmod +x MultiAITradingAndroid/gradlew

      - name: Apply build fixes and pin Gradle version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("MultiAITradingAndroid/gradlew")
          s = wrapper.read_text()
          bypass = 'if command -v gradle >/dev/null 2>&1; then\n  exec "$(command -v gradle)" "$@"\nfi\n'
          if bypass in s:
              s = s.replace(bypass, "", 1)
          if 'VERSION="8.13"' not in s or 'exec "$(command -v gradle)"' in s:
              raise SystemExit("Gradle 8.13 bootstrap wrapper check failed")
          wrapper.write_text(s)

          p = Path("MultiAITradingAndroid/app/src/main/java/com/localtrading/council/ai/OnnxForecastRuntime.kt")
          source = p.read_text()
          old = '    private fun run(modelPath: String, data: FloatArray, desiredShape: LongArray, expectedRank: Int): FloatArray {\n        sessionFor(modelPath).let { session ->'
          new = '    private fun run(modelPath: String, data: FloatArray, desiredShape: LongArray, expectedRank: Int): FloatArray {\n        return sessionFor(modelPath).let { session ->'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Could not locate OnnxForecastRuntime.run return fix")
          p.write_text(source)
          PY
          grep 'VERSION=' MultiAITradingAndroid/gradlew
          grep -A1 'private fun run(modelPath' MultiAITradingAndroid/app/src/main/java/com/localtrading/council/ai/OnnxForecastRuntime.kt

      - name: Build and test
        shell: bash
        run: |
          cd MultiAITradingAndroid
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s MultiAITradingAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh MultiAITradingAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiAITradingCouncil-debug-APK
          path: MultiAITradingAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
